apiVersion: v1
kind: Service
metadata:
  name: oai-udr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oai-core-cn5g.componentLabels" (dict "Values" .Values "Chart" .Chart "Release" .Release "component" "udr") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: oai-udr
  ports:
  - name: sbi
    port: 80
    targetPort: 8080
    protocol: TCP
