apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-amf
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: oai-amf
  template:
    metadata:
      labels:
        app: oai-amf
    spec:
      containers:
      - name: amf
        image: {{ .Values.amf.image }}
        ports:
        - name: ngap
          containerPort: {{ .Values.amf.ngapPort }}
          protocol: SCTP
        - name: sbi
          containerPort: {{ .Values.amf.sbiPort }}
          protocol: TCP
        {{- if .Values.amf.metricsPort }}
        - name: metrics
          containerPort: {{ .Values.amf.metricsPort }}
          protocol: TCP
        {{- end }}
        # keep existing env/volumeMounts/args if present in upstream chart
        {{- with .Values.amf.resources }}
        resources:
{{ toYaml . | indent 10 }}
        {{- end }}
