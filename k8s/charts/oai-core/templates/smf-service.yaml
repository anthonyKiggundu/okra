apiVersion: v1
kind: Service
metadata:
  name: oai-smf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oai-core-cn5g.componentLabels" (dict "Values" .Values "Chart" .Chart "Release" .Release "component" "smf") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: oai-smf
  ports:
  - name: sbi
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: n4
    port: 8805
    targetPort: 8805
    protocol: UDP
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
