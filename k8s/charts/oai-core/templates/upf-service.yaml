apiVersion: v1
kind: Service
metadata:
  name: oai-upf
  namespace: {{ .Values.namespace }}
  labels:
    app: oai-upf
spec:
  type: {{ .Values.upf.service.type | default "ClusterIP" }}
  selector:
    app: oai-upf
  ports:
  - name: gtpu
    port: {{ .Values.upf.gtpuPort | default 2152 }}
    targetPort: {{ .Values.upf.gtpuPort | default 2152 }}
    protocol: UDP
  - name: pfcp
    port: {{ .Values.upf.pfcpPort | default 8805 }}
    targetPort: {{ .Values.upf.pfcpPort | default 8805 }}
    protocol: UDP
  {{- if .Values.upf.metricsPort }}
  - name: metrics
    port: {{ .Values.upf.metricsPort }}
    targetPort: {{ .Values.upf.metricsPort }}
    protocol: TCP
  {{- end }}
