namespace: base-chart
replicaCount: 1

images:
  amf: ghcr.io/anthonykiggundu/oai-amf:internal-api-20260612-1531 #oaisoftwarealliance/oai-amf:latest
  smf: ghcr.io/anthonykiggundu/oai-smf:internal-api-20260511-1553 #oaisoftwarealliance/oai-smf:latest
  udm: oaisoftwarealliance/oai-udm:latest  
  udr: oaisoftwarealliance/oai-udr:latest
  nrf: oaisoftwarealliance/oai-nrf:latest
    #pcf: oaisoftwarealliance/oai-pcf:latest
  mysql: mysql:8.0

mysql:
  auth:
    database: oai_db
    username: test
    password: test
    rootPassword: root
  service:
    port: 3306
  persistence:
    enabled: true
    size: 8Gi

amf:
  service:
    sbiPort: 80
    sbiTargetPort: 8080
    ngapPort: 38412

smf:
  service:
    sbiPort: 80
    sbiTargetPort: 8080
    n4Port: 8805
    n4TargetPort: 8805

udm:
  service:
    port: 80
    targetPort: 8080

udr:
  service:
    port: 80
    targetPort: 8080

nrf:
  service:
    port: 80
    targetPort: 8080

upf:
  # Image settings
  image: "oaisoftwarealliance/oai-upf:latest"

  # Ports (defaults)
  # GTP-U user-plane (UDP)
  gtpuPort: 2152
  # PFCP (N4) control (UDP)
  pfcpPort: 8805
  # Optional metrics port (TCP). Set to null to disable.
  metricsPort: 9100
  hostNetwork: false  # Set to true if you need host networking

  # Network interface configuration
  n3InterfaceName: "eth0"  # GTP-U interface
  n4InterfaceName: "eth0"  # PFCP interface
  n6InterfaceName: "eth0"  # Data network interface
  n4NodeId: "oai-upf"    # PFCP node ID
  n6Gateway: "192.168.70.201"  # Adjust to your network

  # Service configuration
  service:
    type: ClusterIP

  # Optional resource requests/limits
  resources: {}

# Authentication Server Function Configuration
ausf:
  enabled: true
  image:
    repository: oaisoftwarealliance/oai-ausf
    tag: v2.0.0

  service:
    type: ClusterIP
    port: 80 
    targetPort: 80 

  config:
    enabled: true
    mountPath: /openair-ausf/etc/config.yaml
    content: |
      log_level:
        general: debug

      register_nf:
        general: no

      http_version: 1 
      plmn_list:
        - mcc: "208"
          mnc: "95"

      nfs:
        ausf:
          host: oai-ausf
          sbi:
            port: 80
            api_version: v1
            interface_name: eth0
            http_version: 1 

        udm:
          host: oai-udm
          sbi:
            port: 80 
            api_version: v1
            http_version: 1 

