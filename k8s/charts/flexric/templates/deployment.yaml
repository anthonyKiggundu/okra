apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexric
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: flexric
  template:
    metadata:
      labels:
        app: flexric
    spec:
      containers:
      - name: flexric
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: e2
          containerPort: {{ .Values.service.port }}
          protocol: SCTP
        env:
        - name: TZ
          value: Europe/Paris
        volumeMounts:
        - name: flexric-config
          mountPath: /usr/local/etc/flexric/flexric.conf
          subPath: flexric.conf
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: flexric-config
        configMap:
          name: flexric-config
---
apiVersion: v1
kind: Service
metadata:
  name: flexric
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - name: e2
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: SCTP
  selector:
    app: flexric
