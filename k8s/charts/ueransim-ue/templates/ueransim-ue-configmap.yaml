apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-ue-config
  namespace: base-chart #-vanilla
data:
  ue.yaml: |
    supi: "imsi-208950000000035"
    mcc: "208"
    mnc: "95"

    key: {{ .Values.config.key | quote }}
    op: {{ .Values.config.op | quote }}
    opType: "OPC"
    amf: "8000"

    # include these to match the image's sample config
    imei: "356938035643803"
    imeiSv: "4370816125816151"

    gnbSearchList:
      - "10.42.0.39"

    slices:
      - sst: 1
        sd: "000001"

    # UAC Access Identities Configuration (THIS is where mps/mcs must live)
    uacAic:
      mps: false
      mcs: false

    # UAC Access Control Class
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false

    sessions:
      - type: "IPv4"
        apn: {{ .Values.config.apn | quote }}
        #apn: "oai"
        slice:
          sst: 1
          sd: "000001"
        emergency: false

    configured-nssai:
      - sst: 1
        sd: "000001"

    default-nssai:
      - sst: 1
        sd: "000001"

    integrity:
      IA1: true
      IA2: true
      IA3: true

    ciphering:
      EA1: true
      EA2: true
      EA3: true

    integrityMaxRate:
      uplink: "full"
      downlink: "full"

