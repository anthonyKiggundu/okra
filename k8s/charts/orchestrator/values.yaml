namespace: ""  # empty means "use the Helm release namespace" by default

orchestrator:
  # image can be used by templates as .Values.orchestrator.image.repository/.tag
  image:
    repository: ghcr.io/anthonykiggundu/slice-orchestrator
    tag: v4
    pullPolicy: IfNotPresent  # Provide the default image pull policy
  env:
    REDIS_URL: "redis://redis-master.base-chart.svc.cluster.local:6379/0"      
    pullPolicy: IfNotPresent
  # keep a replicas key to be used by updated templates (.Values.orchestrator.replicas)
  replicas: 1
  service:  
    type: ClusterIP
  resources: {}
  # optional endpoints for notifications (FlexRAN / UPF)
  ranNotifyUrl: ""  # e.g. http://flexran-controller.namespace.svc.cluster.local:8080/notify
  upfNotifyUrl: ""  # e.g. http://oai-upf.namespace.svc.cluster.local:8080/notify

redis:
  url: "redis://redis-master.base-chart.svc.cluster.local:6379/0"
