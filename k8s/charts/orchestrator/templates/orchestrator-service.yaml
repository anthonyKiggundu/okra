apiVersion: v1
kind: Service
metadata:
  name: oai-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    app: oai-orchestrator
spec:
  type: {{ .Values.orchestrator.service.type | default "ClusterIP" }}
  selector:
    app: oai-orchestrator
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
