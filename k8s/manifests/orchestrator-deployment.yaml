apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels: { app: orchestrator }
  template:
    metadata: { labels: { app: orchestrator } }
    spec:
      containers:
      - name: orchestrator
        image: your-registry/orchestrator:latest
        env:
          - name: REDIS_URL
            value: "redis-master.5g.svc.cluster.local:6379/0"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mychart.fullname" . | default "orchestrator" }}
  labels:
    app: {{ .Values.app.name | default "orchestrator" }}
spec:
  selector:
    app: {{ .Values.app.name | default "orchestrator" }}
{{- with .Values.service.ports }}
  ports:
{{ toYaml . | nindent 4 }}
{{- else }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
{{- end }}
  type: {{ .Values.service.type | default "ClusterIP" }}
