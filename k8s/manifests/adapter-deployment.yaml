apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-adapter
  labels: { app: ue-adapter }
spec:
  replicas: 1
  selector: { matchLabels: { app: ue-adapter } }
  template:
    metadata: { labels: { app: ue-adapter } }
    spec:
      containers:
      - name: ue-adapter
        image: your-registry/ue-adapter:latest
        env:
          - name: OAI_SMF_API
            value: "http://oai-smf.5g.svc.cluster.local:8000"
        ports:
          - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ue-adapter
spec:
  selector: { app: ue-adapter }
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
