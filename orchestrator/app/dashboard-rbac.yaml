apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: ran
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: ran
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: ran
subjects:
- kind: ServiceAccount
  name: dashboard-sa
  namespace: ran
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
